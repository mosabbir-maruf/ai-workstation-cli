name: Build AI Workstation

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-workstation-cli-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-workstation-cli
  RETAIN_IMAGE_VERSIONS: 2

jobs:
  build:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=AI Workstation CLI
            org.opencontainers.image.description=Docker container environment for AI Workstation CLI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        run: |
          set -euo pipefail

          echo "Inspecting published image..."
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"

          echo
          echo "Inspecting commit image..."
          docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Cleanup old GHCR image versions
        uses: actions/github-script@v8
        env:
          RETAIN_IMAGE_VERSIONS: ${{ env.RETAIN_IMAGE_VERSIONS }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const packageName = "ai-workstation-cli";
            const keepImages = Number(process.env.RETAIN_IMAGE_VERSIONS || "2");

            console.log(`Package: ${packageName}`);
            console.log(`Image retention: newest ${keepImages} tagged versions`);

            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser,
              {
                package_type: "container",
                package_name: packageName,
                per_page: 100,
              }
            );

            const activeVersions = versions
              .filter((version) => !version.deleted_at)
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime()
              );

            const taggedVersions = activeVersions.filter((version) => {
              const tags = version.metadata?.container?.tags ?? [];
              return tags.length > 0;
            });

            console.log(`Found ${activeVersions.length} active package versions.`);
            console.log(`Found ${taggedVersions.length} tagged image versions.`);

            const versionsToKeep = taggedVersions.slice(0, keepImages);
            const keptIds = new Set(versionsToKeep.map((version) => version.id));

            console.log("Keeping:");

            for (const version of versionsToKeep) {
              const tags = version.metadata?.container?.tags ?? [];

              console.log(
                `  - ${version.id} | ${version.created_at} | ${tags.join(", ")}`
              );
            }

            const oldestKeptDate =
              versionsToKeep.length > 0
                ? new Date(versionsToKeep[versionsToKeep.length - 1].created_at)
                : new Date();

            const versionsToDelete = activeVersions.filter((version) => {
              if (keptIds.has(version.id)) {
                return false;
              }

              const tags = version.metadata?.container?.tags ?? [];
              const createdAt = new Date(version.created_at);

              /*
               * Delete old tagged image versions.
               *
               * Also delete untagged versions only when they are older
               * than the oldest retained tagged image. This prevents
               * recent provenance/SBOM-related versions from being
               * deleted while still allowing old registry garbage to
               * be reclaimed.
               */
              if (tags.length > 0) {
                return true;
              }

              return createdAt < oldestKeptDate;
            });

            console.log(`Deleting ${versionsToDelete.length} old versions...`);

            for (const version of versionsToDelete) {
              const tags = version.metadata?.container?.tags ?? [];

              console.log(
                `Deleting ${version.id} | ${version.created_at} | ` +
                `${tags.length ? tags.join(", ") : "untagged"}`
              );

              await github.rest.packages.deletePackageVersionForAuthenticatedUser(
                {
                  package_type: "container",
                  package_name: packageName,
                  package_version_id: version.id,
                }
              );
            }

            console.log("GHCR cleanup completed successfully.");
