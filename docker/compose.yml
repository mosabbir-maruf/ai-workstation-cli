services:
  workstation:
    image: ${IMAGE:-ghcr.io/mosabbir-maruf/ai-workstation-cli:latest}
    container_name: ai-workstation-cli
    restart: unless-stopped

    group_add:
      - "${GITHUB_BROKER_GID:-987}"

    working_dir: /workspace

    environment:
      HOME: /home/sandbox
      NPM_CONFIG_PREFIX: /home/sandbox/.npm-global
      PATH: /home/sandbox/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
      DSH_VERSION: ${DSH_VERSION:-0.1.2-rc.1}
      HOST: 0.0.0.0
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}

    volumes:
      - ${ACTIVE_PROJECT_PATH:-/tmp}:/workspace
      - ${AI_WORKSTATION_ROOT:-/home/mosabbir/ai-workstation-cli}/runtime/npm-global:/home/sandbox/.npm-global
      - ${AI_WORKSTATION_ROOT:-/home/mosabbir/ai-workstation-cli}/runtime/dsh:/home/sandbox/.dsh
      - ${AI_WORKSTATION_ROOT:-/home/mosabbir/ai-workstation-cli}/runtime/app:/run/ai-workstation-cli/app
      - ${AI_WORKSTATION_ROOT:-/home/mosabbir/ai-workstation-cli}/runtime/github-broker:/run/ai-github-broker
      - ${AI_WORKSTATION_ROOT:-/home/mosabbir/ai-workstation-cli}/runtime/harness:/run/ai-workstation-cli/harness

    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:4090:4091"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    privileged: false

    mem_limit: 512m
    cpus: "1.5"
    pids_limit: 256

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

    entrypoint:
      - /usr/bin/tini
      - --
      - /usr/local/bin/entrypoint.sh

    command:
      - sleep
      - infinity
